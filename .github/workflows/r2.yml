# 전국 타일을 Cloudflare R2에 올림 (수동 실행). 저장소 Settings → Secrets and variables → Actions에 아래 값을 넣어야 함
#   Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   Variables: R2_BUCKET
# 올린 뒤 Variables에 TILE_URL(버킷 공개 주소 + /tiles)을 넣으면 사이트가 R2에서 타일을 읽음
name: upload-r2
on: workflow_dispatch

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/south-korea-latest.osm.pbf
          key: korea-pbf-v1
      - run: npm run build:tiles
      - run: scripts/upload-r2.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
