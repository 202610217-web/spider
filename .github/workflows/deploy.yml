# 전국 건물·도로 타일을 만들고 사이트를 GitHub Pages에 배포
name: deploy
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: npm ci
      - run: npm test
      # 추출본은 캐시 (새 지도 데이터가 필요하면 키의 v1을 올림)
      - uses: actions/cache@v4
        with:
          path: data/south-korea-latest.osm.pbf
          key: korea-pbf-v1
      # OSM에 없는 건물(Overture, 위성 AI 윤곽). 릴리스를 바꾸면 키도 바꿈
      - uses: actions/cache@v4
        with:
          path: data/overture.ndjson
          key: overture-2026-10-21.0-v1
      - name: Overture 건물 받기
        run: |
          [ -f data/overture.ndjson ] || { pip install duckdb==2.0.0 && python3 scripts/overture.py; }
      - name: 전국 타일 생성
        run: |
          mkdir -p data
          [ -f data/south-korea-latest.osm.pbf ] || curl -fL -o data/south-korea-latest.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          npm run build:tiles
          du -sh public/data/tiles
          # GitHub Pages 사이트 한도는 1GB: 넘으면 배포가 깨지므로 여기서 멈춤
          [ $(du -sm public/data | cut -f1) -lt 950 ] || { echo '타일이 950MB를 넘음 — R2로 옮기거나 줄여야 함'; exit 1; }
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_TILE_URL: ${{ vars.TILE_URL }} # 비어 있으면 사이트에 함께 올린 타일을 읽음
          VITE_KAKAO_KEY: ${{ vars.KAKAO_JS_KEY }} # 카카오 JavaScript 키(도메인 제한). 비어 있으면 장소 검색은 OSM을 씀
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
