# 전국 건물·도로 타일을 만들고 사이트를 GitHub Pages에 배포
name: deploy
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: npm ci
      - run: npm test
      # 추출본은 캐시 (새 지도 데이터가 필요하면 키의 v1을 올림)
      - uses: actions/cache@v4
        with:
          path: data/south-korea-latest.osm.pbf
          key: korea-pbf-v1
      # OSM에 없는 건물(Overture). 받는 데 오래 걸려 캐시함 (새로 받으려면 키의 v1을 올림)
      - uses: actions/cache@v4
        with:
          path: data/overture.ndjson
          key: overture-v1
      - run: scripts/fetch-overture.sh
        timeout-minutes: 90
      - name: 전국 타일 생성
        run: |
          mkdir -p data
          [ -f data/south-korea-latest.osm.pbf ] || curl -fL -o data/south-korea-latest.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          npm run build:tiles
          du -sh public/data/tiles # GitHub Pages 한도는 1GB
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_TILE_URL: ${{ vars.TILE_URL }} # 비어 있으면 사이트에 함께 올린 타일을 읽음
          VITE_KAKAO_KEY: ${{ vars.KAKAO_JS_KEY }} # 카카오 JavaScript 키(도메인 제한). 비어 있으면 장소 검색은 OSM을 씀
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' # 브랜치 빌드는 배포하지 않으므로 올리지 않음
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
